name: Android checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Scan for high-confidence credentials
        shell: pwsh
        run: ./scripts/check-secrets.ps1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate and test bundled JavaScript
        run: |
          node scripts/validate-source.cjs
          node scripts/test-source.cjs

      - name: Test laptop Maestro bridge in dry-run mode
        run: |
          python3 -m pip install -r tools/laptop-maestro-bridge/requirements.txt
          python3 tools/laptop-maestro-bridge/test_bridge.py

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
